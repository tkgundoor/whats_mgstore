[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-forensics"
version = "0.1.0"
description = "Authorized WhatsApp backup decryption and forensic analysis toolkit"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=42.0",
  "pandas>=2.2",
  "networkx>=3.3",
  "openpyxl>=3.1",
  "reportlab>=4.2",
  "streamlit>=1.37",
]

[project.scripts]
wa-forensics = "whatsapp_forensics.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
